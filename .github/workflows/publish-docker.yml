# =============================================================================
# 工作流名称
# =============================================================================
name: Publish Docker Image

# =============================================================================
# 触发条件：当代码推送到 main 分支时
# =============================================================================
on:
  push:
    branches: [ "main" ]

# =============================================================================
# 定义工作流中的任务
# =============================================================================
jobs:
  # --------------------------------------------------------------------------
  # 任务：构建并推送 Docker 镜像
  # --------------------------------------------------------------------------
  build-and-push:
    # 运行在最新的 Ubuntu 虚拟机上
    runs-on: ubuntu-latest

    # 设置任务所需的权限
    permissions:
      contents: read       # 读取仓库代码
      packages: write      # 推送 Docker 镜像到 GitHub Packages

    # --------------------------------------------------------------------------
    # 定义任务的步骤
    # --------------------------------------------------------------------------
    steps:
      # 步骤 1: 检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 登录到 GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 3: 提取 Docker 元数据（标签、注解）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # latest 标签——始终指向最新的 main 分支构建
            type=raw,value=latest,enable={{is_default_branch}}
            # 语义化版本标签——从 Git 标签提取（如 v1.0.0）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 短提交 SHA——唯一标识每次构建，便于回滚
            type=sha,format=short,prefix=

      # 步骤 4: 构建并推送 Docker 镜像
      # 使用 Krystal579-max.dockerfile（与项目根目录下的 Dockerfile 匹配）
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Krystal579-max.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 步骤 5: （可选）发送构建成功通知
      - name: Send build status notification
        if: success()
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ghcr.io/${{ github.repository }}"
          echo "🏷️ Tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr '\n' '\n  '