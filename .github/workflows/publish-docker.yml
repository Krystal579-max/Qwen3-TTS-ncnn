# .github/workflows/publish-docker.yml

name: Publish Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 登录到 GitHub Container Registry (ghcr.io)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 3: 构建并推送 Docker 镜像
      # 注意: 使用 Krystal579-max.dockerfile 而非默认的 Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Krystal579-max.dockerfile
          push: true
          tags: |
            ghcr.io/Krystal579-max/qwen3-tts-ncnn:latest
            ghcr.io/Krystal579-max/qwen3-tts-ncnn:${{ github.sha }}