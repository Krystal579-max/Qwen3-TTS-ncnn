# .github/workflows/publish-docker.yml

name: Publish Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 增加严格的权限设置，确保有写入包和内容的权限
    permissions:
      contents: write
      packages: write

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 登录到 GitHub Container Registry (ghcr.io)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 3: 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # 使用当前目录作为构建上下文
          push: true  # 构建成功后推送
          tags: |
            ghcr.io/${{ github.repository }}/qwen3-tts-ncnn:latest
            ghcr.io/${{ github.repository }}/qwen3-tts-ncnn:${{ github.sha }}
        # 添加一个条件，如果构建失败，输出更多日志
        if: success() || failure()